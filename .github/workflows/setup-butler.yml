---
name: setup-butler

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - os: macos-15-intel
          - os: macos-latest
          # Run the amd64 build on an arm64 runner to test the architecture
          # input, which the macOS runners support through Rosetta.
          - os: macos-latest
            architecture: amd64
          - os: ubuntu-24.04-arm
          - os: ubuntu-latest
          - os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run action
        uses: ./
        with:
          architecture: ${{ matrix.architecture }}

      - name: Run butler
        run: butler -V
